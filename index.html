<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="preload" href="images/splash-btt2026-logo.webp" as="image" fetchpriority="high">
    <link rel="preload" href="images/ship.webp" as="image" fetchpriority="high">
    <link rel="preload" href="fonts/fc-minimal-regular.woff2" as="font" type="font/woff2" crossorigin>

<body>
    <main class="splash" aria-labelledby="splash-title">
        <div class="splash__frame">
            <div class="splash__background" aria-hidden="true">
                <video class="splash__background-video splash__background-video--a" autoplay muted loop playsinline

                    <source src="video/background-mobile.mp4" type="video/mp4" media="(max-width: 991px)">
                    <source src="video/background.mp4" type="video/mp4">
                </video>
                <video class="splash__background-video splash__background-video--b" muted playsinline
                    webkit-playsinline preload="auto" poster="images/background.png" disablepictureinpicture>
                    <source src="video/background-mobile.mp4" type="video/mp4" media="(max-width: 991px)">
                    <source src="video/background.mp4" type="video/mp4">
                </video>
            </div>

            <section class="splash__content">

                </p>

                    <p class="splash__time"><time datetime="2026-10-31T09:00:00+07:00">เวลา 09:00 - 18:30 น.</time></p>
                    <p class="splash__venue">Samyan Mitrtown Hall <br class="venue-br">ชั้น 5 ศูนย์การค้าสามย่านมิตรทาวน์</p>
                </div>

                <div class="splash__sponsors" aria-label="ผู้สนับสนุน">
                    <ul class="sponsor__logos sponsor__logos--lead">
                        <li class="sponsor__logo sponsor__logo--lead"></li>

            <div class="splash__scene" aria-hidden="true">

                    height="800" alt="">

                    height="769" alt="">
                <img class="splash__asset splash__asset--gold" src="images/gold.webp" width="369"
                    height="800" alt="">

                <img class="splash__ship" src="images/ship.webp" width="1361" height="1700" alt=""

                <img class="splash__asset splash__asset--stock" src="images/stock.webp" width="178"
                    height="800" alt="">
                <img class="splash__asset splash__asset--heart" src="images/heart.webp" width="800"
                    height="750" alt="">
                <img class="splash__asset splash__asset--card" src="images/card.webp" width="743"
                    height="800" alt="">

                <img class="splash__stairs" src="images/stairs.webp" width="2000" height="568" alt=""

                    <img class="splash__person splash__person--1" src="images/p1-far.webp" width="638"

                    <img class="splash__person splash__person--6" src="images/p6.webp" width="237"

                    <img class="splash__person splash__person--7" src="images/p7-left.webp" width="520"

    <script type="module" src="js/background-video-loop.js"></script>

    <script type="module" src="js/hero-v2-cta.js"></script>

</html>
